name: StockBot CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Test
        run: pytest -q
      - name: Safeguard smoke test
        run: python scripts/run_safeguard_smoke.py
      - name: Paper readiness gate
        run: python scripts/check_paper_readiness.py
      - name: Shadow readiness gate
        run: python scripts/check_shadow_readiness.py
      - name: Integrated paper runtime demo
        run: python scripts/run_paper_runtime_demo.py
      - name: Shadow runtime demo
        run: python scripts/run_shadow.py --demo
      - name: Causal live-shadow demo
        run: python scripts/run_live_shadow.py --demo
      - name: V0 demo
        run: python scripts/run_demo.py
      - name: V1 training demo
        run: python scripts/run_training_demo.py
      - name: V1.2 offline market-data smoke
        run: pytest -q tests/data/test_tiingo_provider.py tests/data/test_yahoo_bootstrap_provider.py tests/data/test_snapshots.py tests/data/test_download.py tests/integration/test_market_training.py tests/integration/test_market_cli.py
